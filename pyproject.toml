[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orcarchy"
version = "0.1.0"
description = "Bring your Omarchy palette to Orca's interface, editor, and terminals."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "wilkywayre"}]
dependencies = []

[project.scripts]
orcarchy = "orcarchy.cli:main"

[project.urls]
Repository = "https://github.com/wilkywayre/orcarchy"

[tool.setuptools.packages.find]
where = ["src"]
